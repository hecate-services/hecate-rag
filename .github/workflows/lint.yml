name: lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  elvis:
    runs-on: ubuntu-latest
    container:
      # MUST MATCH the Containerfile's builder stage OTP version.
      image: erlang:28
    steps:
      - uses: actions/checkout@v4
      # hecate_om pulls in rocksdb (via barrel_docdb) and khepri/ra
      # transitively, unconditionally -- needed to even compile, which
      # `rebar3 lint` requires before elvis can analyze anything.
      # libsnappy-dev liblz4-dev libzstd-dev libbz2-dev: rocksdb's
      # CMakeLists auto-detects each via find_package() and, if one is
      # missing, silently disables it rather than failing the build --
      # install all four, not just whichever this repo happens to
      # exercise first. Same reasoning as hecate-om's/hecate-mail's own
      # lint-and-test.yml.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake build-essential libsnappy-dev liblz4-dev libzstd-dev libbz2-dev
      # macula_cbor_nif (macula's CBOR wire codec) has no Erlang
      # fallback by design and always builds from source -- macula's
      # own precompiled-download path only covers the QUIC NIF. Without
      # Rust here, `rebar3 lint` used to go green (or, before that,
      # fail earlier on the QUIC NIF's own now-fixed download gap)
      # while never actually building macula_cbor_nif, silently masking
      # a compile that would fail every caller at runtime with
      # nif_not_loaded. Same fix hecate_om's lint-and-test.yml already
      # documents and applies for the identical reason.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: rebar3 lint
