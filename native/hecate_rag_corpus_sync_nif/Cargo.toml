[package]
name    = "hecate_rag_corpus_sync_nif"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rustler NIF: fetch + fast-forward hecate-rag's corpus git checkout (vendored libgit2, no OS git dependency)"

[lib]
name       = "hecate_rag_corpus_sync_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
